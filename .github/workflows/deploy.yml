# Compila la web con Astro y la publica en GitHub Pages.
# En los pull request solo compila, para saber antes de fusionar si algo se rompe.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        # Datos públicos de Supabase (ADR 0006) y del formulario (ADR 0007): van
        # en Settings → Secrets and variables → Actions → Variables. Si faltan,
        # /entrar/ y el formulario avisan de que aún no están conectados. Las
        # claves secretas (service_role, Turnstile) nunca van aquí: viven en n8n.
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_N8N_CONTACT_URL: ${{ vars.PUBLIC_N8N_CONTACT_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_N8N_REPLY_URL: ${{ vars.PUBLIC_N8N_REPLY_URL }}
          PUBLIC_CHATBOT_URL: ${{ vars.PUBLIC_CHATBOT_URL }}
      # Todos los enlaces a otras webs se abren en otra pestaña (#53)
      - run: npm run check:enlaces
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
